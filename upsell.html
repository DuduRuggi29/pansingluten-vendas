<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Oferta Especial Exclusiva! - Panes Sin Gluten</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #2ecc71;
            --dark-bg: #0a0a0a;
            --emerald-accent: #062c1d;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--emerald-accent) 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
        }

        .icon-success {
            font-size: 3rem;
            color: var(--primary-green);
            margin-bottom: 20px;
            display: inline-block;
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        @keyframes scaleIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
            background: linear-gradient(to bottom, #ffffff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 35px;
        }

        .cta-button {
            display: block;
            width: 100%;
            padding: 20px 30px;
            background: var(--primary-green);
            color: #000;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            border-radius: 14px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        .cta-button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px rgba(46, 204, 113, 0.4);
            filter: brightness(1.1);
        }

        .cta-button:active {
            transform: translateY(0) scale(1);
        }

        .no-bonus {
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            transition: color 0.3s ease;
            text-decoration: none;
        }

        .no-bonus:hover {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            .glass-card {
                padding: 30px 20px;
            }
            .cta-button {
                font-size: 1rem;
                padding: 18px 20px;
            }
        }
    </style>

</head>
<body>

    <div class="container">
        <div class="glass-card">
            <span class="icon-success">✓</span>
            <h1>¡Tu compra está siendo procesada!</h1>
            <p>
                Como agradecimiento por haber adquirido nuestras recetas, hoy queremos ofrecerte un beneficio exclusivo: 
                <strong>¡cada semana recibirás recetas nuevas como bono totalmente gratis!</strong>
            </p>

            <button class="cta-button" onclick="window.location.href='#'">
                SÍ, QUIERO CONFIRMAR MI COMPRA CON EL BONO...
            </button>

            <button class="no-bonus" onclick="window.location.href='#'">
                No, no quiero este bono
            </button>
        </div>
    </div>

</body>
</html>
