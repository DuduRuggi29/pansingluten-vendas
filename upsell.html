<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Oferta Especial Exclusiva! - Panes Sin Gluten</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-orange: #ff6900;
            --dark-bg: #0a0a0a;
            --accent-bg: #1a0f00;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            max-width: 100vw;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--accent-bg) 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
        }

        .hero-image {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: scaleIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards;
            opacity: 0;
            transform: scale(0.9);
        }

        @keyframes scaleIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .icon-success {
            font-size: 2.5rem;
            color: var(--primary-orange);
            margin-bottom: 15px;
            display: inline-block;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
            background: linear-gradient(to bottom, #ffffff, #ffa56d);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 35px;
        }

        .cta-button {
            display: block;
            width: 100%;
            padding: 22px 30px;
            background: var(--primary-orange);
            color: #ffffff;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.2rem;
            border-radius: 16px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255, 105, 0, 0.3);
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cta-button:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 15px 35px rgba(255, 105, 0, 0.5);
            filter: brightness(1.1);
        }

        .cta-button:active {
            transform: translateY(0) scale(1);
        }

        .no-bonus {
            background: transparent;
            color: rgba(255, 255, 255, 0.4);
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            padding: 10px;
            display: inline-block;
        }

        .no-bonus:hover {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 15px;
                align-items: flex-start;
                padding-top: 40px;
            }
            h1 {
                font-size: 1.6rem;
            }
            .glass-card {
                padding: 30px 20px;
                border-radius: 20px;
            }
            .cta-button {
                font-size: 1rem;
                padding: 20px 15px;
                border-radius: 12px;
            }
            .hero-image {
                max-width: 100%;
            }
            #hotmart-sales-funnel {
                max-width: 100% !important;
                overflow: hidden !important;
            }
        }

        #hotmart-sales-funnel {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            position: relative; /* Necessário para o posicionamento da máscara */
        }

        /* Máscara totalmente responsiva (Desktop e Mobile) */
        .price-mask {
            position: absolute;
            top: 75px; /* Valor base para Desktop */
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            height: 55px;
            background: #ffffff; 
            z-index: 10000;
            pointer-events: none;
            display: none;
        }

        /* Ajuste específico para Telas Pequenas (Celular) */
        @media (max-width: 480px) {
            .price-mask {
                top: 115px !important; /* Baixou de 92px para 115px */
                height: 60px !important;
            }
        }

        /* Tentativa de CSS direto (caso não seja iframe) */
        #hotmart-sales-funnel div[class*="price"], 
        #hotmart-sales-funnel span[class*="price"],
        #hotmart-sales-funnel div[class*="value"],
        #hotmart-sales-funnel .hot-elements-price {
            display: none !important;
            visibility: hidden !important;
        }
    </style>

    defer
    ></script>
</head>
<body>

    <div class="container">
        <div class="glass-card">
            <img src="upsell-chef.png" alt="Chef Catalina Jiménez" class="hero-image">
            
            <span class="icon-success">✓</span>
            <h1>¡Tu compra está siendo procesada!</h1>
            <p>
                Como agradecimiento por haber adquirido nuestras recetas, hoy queremos ofrecerte un beneficio exclusivo: 
                <br><strong>¡cada semana recibirás en tu correo recetas sin gluten, sin azúcar y recetas que ayudan a evitar picos de glucosa!</strong>
            </p>


            <div style="position: relative; width: 100%;">
                <!-- HOTMART - Sales Funnel Widget -->
                <div id="hotmart-sales-funnel"></div>
                <!-- HOTMART - Sales Funnel Widget -->
                
                <!-- Máscara de Camuflagem -->
                <div class="price-mask" id="price-mask"></div>
            </div>

        </div>
    </div>

    <!-- HOTMART - Sales Funnel Widget Script -->
    <script src="https://checkout.hotmart.com/lib/hotmart-checkout-elements.js"></script>
    <script>
        checkoutElements.init('salesFunnel').mount('#hotmart-sales-funnel');

        function forceHidePrice() {
            const mask = document.getElementById('price-mask');
            const funnel = document.getElementById('hotmart-sales-funnel');
            const iframe = funnel.querySelector('iframe');
            
            if (mask) {
                mask.style.display = 'block';
                
                // Ajuste dinâmico baseado na altura do iframe se necessário
                if (iframe && iframe.offsetHeight > 0) {
                    const h = iframe.offsetHeight;
                    // Ajuste de precisão: movido de 33% para 42% para descer a máscara
                    if (window.innerWidth < 480) {
                        mask.style.top = (h * 0.42) + 'px';
                    } else {
                        mask.style.top = (h * 0.35) + 'px';
                    }
                }
            }
            
            // Tenta esconder via CSS caso não seja iframe (camada dupla)
            const internalPrice = funnel.querySelectorAll('[class*="price"], [class*="value"], .hot-elements-price');
            internalPrice.forEach(el => {
                el.style.setProperty('display', 'none', 'important');
                el.style.setProperty('visibility', 'hidden', 'important');
                el.style.setProperty('opacity', '0', 'important');
            });
        }

        // Executa em loop curto para não dar tempo de o preço aparecer
        setInterval(forceHidePrice, 200);
    </script>
</body>
</html>
